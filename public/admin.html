<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="theme-color" content="#0f766e"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<title>لوحة الإدارة</title></head><body><div id="nav"></div><main class="sh-wrap">
<div class="card"><h2>إعدادات الاشتراك</h2><div class="row"><div style="flex:1;min-width:200px"><label>رقم واتساب الإدارة (بصيغة دولية)</label><input id="wa" dir="ltr"></div><div style="width:120px"><label>العملة</label><input id="cu"></div></div>
<label><input type="checkbox" id="en2" style="width:auto;margin:0 0 0 8px">إلزام المدرسين بالاشتراك لإضافة امتحانات جديدة (اتركه مغلقاً أثناء التجربة)</label><button class="btn" onclick="ss()">حفظ الإعدادات</button></div>
<h2>الباقات</h2><div class="g3" id="pl"></div>
<div class="card"><h2>المدرسون <span class="tag" id="n"></span></h2><div style="overflow:auto"><table id="t"></table></div></div></main><div id="toast"></div>
<script src="/app.js"></script><script>const G=id=>document.getElementById(id);let PLANS=[];
api('/api/me').then(m=>{if(m.role!=='admin')location='/dashboard';nav('<button class="sh-btn" onclick="logout()" title="خروج">'+svg('out',18)+'</button>')}).catch(x=>x.status===401?location='/login':toast(x.message));
async function loadS(){const d=await api('/api/admin/settings');PLANS=d.plans;G('wa').value=d.whatsapp;G('cu').value=d.currency;G('en2').checked=d.enforce;
G('pl').innerHTML=PLANS.map(p=>'<div class="card"><h3 style="margin:0 0 8px">'+PNAME[p.key]+'</h3><label>اسم الباقة</label><input id="pn_'+p.key+'" value="'+esc(p.name)+'"><label>السعر (فارغ = تواصل لمعرفة السعر)</label><input id="pp_'+p.key+'" type="number" min="0" value="'+(p.price??'')+'"><label>وصف قصير</label><input id="pd_'+p.key+'" value="'+esc(p.desc)+'"><label>المميزات (سطر لكل ميزة)</label><textarea id="pf_'+p.key+'">'+esc((p.features||[]).join('\n'))+'</textarea><label><input type="checkbox" id="pa_'+p.key+'" '+(p.active?'checked':'')+' style="width:auto;margin:0 0 0 8px">ظاهرة للمدرسين</label><button class="btn sm" onclick="sp(\''+p.key+'\')">حفظ الباقة</button></div>').join('')}
async function ss(){try{await api('/api/admin/settings','PUT',{whatsapp:G('wa').value,currency:G('cu').value,enforce:G('en2').checked});toast('تم حفظ الإعدادات')}catch(x){toast(x.message)}}
async function sp(k){try{await api('/api/admin/plans/'+k,'PUT',{name:G('pn_'+k).value,price:G('pp_'+k).value,desc:G('pd_'+k).value,features:G('pf_'+k).value,active:G('pa_'+k).checked});toast('تم حفظ الباقة')}catch(x){toast(x.message)}}
function ps(u){const p=u.plan;if(!p||!p.type)return'بدون باقة';const n=PNAME[p.type];
if(p.type==='lifetime')return n;if(p.type==='exam')return n+' — متبقي '+(p.examsLeft||0);const e=new Date(p.expiresAt);return n+(e>new Date()?' — حتى '+e.toLocaleDateString('ar-EG'):' — منتهية')}
async function load(){const u=await api('/api/admin/users');G('n').textContent=u.length;const opts='<option value="none">بدون باقة</option>'+Object.entries(PNAME).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
G('t').innerHTML='<tr><th>الاسم</th><th>المادة</th><th>الهاتف</th><th>الرابط</th><th>الحالة</th><th>الباقة</th><th></th></tr>'+u.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.phone)+'</td><td><a href="/t/'+esc(x.slug)+'" target="_blank">'+esc(x.slug)+'</a></td><td><span class="tag">'+(x.active?'مفعّل':'موقوف')+'</span></td>'+
'<td><div class="mut" style="font-size:.82rem">'+esc(ps(x))+'</div><div class="row"><select id="as_'+x._id+'" style="margin:4px 0;width:auto">'+opts+'</select><button class="btn sm" onclick="ap(\''+x._id+'\')">تفعيل</button></div></td>'+
'<td class="row"><button class="btn sm" onclick="en(\''+x._id+'\')">'+svg('login',16)+'دخول للحساب</button><button class="btn ghost sm" onclick="tg(\''+x._id+'\','+!x.active+')">'+(x.active?'إيقاف':'تفعيل')+'</button><button class="btn bad sm" onclick="rm(\''+x._id+'\')">حذف</button></td></tr>').join('')}
async function ap(i){try{await api('/api/admin/users/'+i+'/plan','POST',{type:G('as_'+i).value});toast('تم تحديث الباقة');load()}catch(x){toast(x.message)}}
async function en(i){try{await api('/api/admin/impersonate/'+i,'POST');location='/dashboard'}catch(x){toast(x.message)}}
async function tg(i,a){await api('/api/admin/users/'+i,'PATCH',{active:a});load()}
async function rm(i){if(confirm('حذف المدرس وكل بياناته نهائياً؟')){await api('/api/admin/users/'+i,'DELETE');load()}}
loadS().then(load).then(reveal).catch(x=>toast(x.message));</script></body></html>
