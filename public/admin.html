<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/favicon.svg"><meta name="theme-color" content="#0f766e"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>لوحة الإدارة</title></head><body><div class="wrap"><div id="nav"></div><div class="card"><h2>المدرسون <span class="tag" id="n"></span></h2><div style="overflow:auto"><table id="t"></table></div></div></div><div id="toast"></div>
<script src="/app.js"></script><script>api('/api/me').then(m=>{if(m.role!=='admin')location='/dashboard';nav('<button class="btn ghost sm" onclick="logout()">خروج</button>')}).catch(x=>x.status===401?location='/login':toast(x.message));
async function load(){const u=await api('/api/admin/users');n.textContent=u.length;
t.innerHTML='<tr><th>الاسم</th><th>المادة</th><th>الهاتف</th><th>الرابط</th><th>الحالة</th><th></th></tr>'+u.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.phone)+'</td><td><a href="/t/'+esc(x.slug)+'" target="_blank">'+esc(x.slug)+'</a></td><td><span class="tag">'+(x.active?'مفعّل':'موقوف')+'</span></td><td class="row"><button class="btn sm" onclick="tg(\''+x._id+'\','+!x.active+')">'+(x.active?'إيقاف':'تفعيل')+'</button><button class="btn bad sm" onclick="rm(\''+x._id+'\')">حذف</button></td></tr>').join('')}
async function tg(i,a){await api('/api/admin/users/'+i,'PATCH',{active:a});load()}
async function rm(i){if(confirm('حذف المدرس وكل بياناته نهائياً؟')){await api('/api/admin/users/'+i,'DELETE');load()}}load();</script></body></html>
