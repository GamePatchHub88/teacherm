<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/favicon.svg"><meta name="theme-color" content="#0f766e"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>نتيجة الطالب</title></head><body><div class="wrap" style="max-width:560px"><div id="nav"></div>
<div class="card"><h2 id="tn">...</h2><p class="mut" id="ts"></p><label>الامتحان</label><select id="es"></select><label>رقم الجلوس</label><input id="seat" inputmode="numeric" placeholder="اكتب رقم الجلوس">
<button class="btn" style="width:100%" id="go">عرض النتيجة</button><div id="out"></div></div></div><div id="toast"></div><script src="/app.js"></script><script>nav();
const slug=location.pathname.split('/')[2];
api('/api/public/'+slug).then(d=>{tn.textContent='نتائج '+d.name;ts.textContent='مادة '+d.subject;document.title='نتائج '+d.name;
es.innerHTML=d.exams.map(x=>'<option value="'+x._id+'">'+esc(x.title)+'</option>').join('')}).catch(()=>{tn.textContent='الصفحة غير موجودة'});
go.onclick=async()=>{out.innerHTML='';try{const r=await api('/api/public/'+slug+'/lookup','POST',{examId:es.value,seat:seat.value});
out.innerHTML='<h2 style="margin-top:16px">'+esc(r.name)+'</h2><div class="res">'+Object.entries(r.data).map(([k,v])=>'<div><span class="mut">'+esc(k)+'</span><b>'+esc(v)+'</b></div>').join('')+'</div>'}catch(x){toast(x.message)}};
seat.onkeydown=e=>e.key==='Enter'&&go.click();</script></body></html>
