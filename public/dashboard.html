<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="theme-color" content="#0f766e"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>لوحة المدير | TeacherM</title><meta name="robots" content="noindex, nofollow, nocache"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body><div id="nav"></div><main class="wrap"><section class="hero"><div class="bismillah">بسم الله الرحمن الرحيم</div><h1>لوحة المدير</h1><div class="exam" id="hs">...</div><div class="sub" id="hi">جاري التحميل...</div></section><div id="imp"></div>
<div class="card"><p class="mut" id="stat" style="margin:0 0 8px"></p><label>رابط موقع طلابك</label><div class="row"><input id="lnk" readonly dir="ltr" style="flex:1;margin:0"><button class="btn" onclick="navigator.clipboard.writeText(lnk.value);toast('تم النسخ')">نسخ الرابط</button><a class="btn ghost" id="pl" target="_blank">معاينة الموقع</a></div></div>
<div class="atabs" id="tabs" role="tablist"></div>

<section id="t1"><div class="card"><h2>الامتحانات</h2><form class="row" id="nf"><input id="nt" placeholder="اسم الامتحان" style="flex:1;margin:0" required><button class="btn">إضافة</button></form><div style="overflow:auto"><table id="ex"></table></div></div>

<div class="card" id="stc"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">الطلاب <span class="tag" id="stn">0</span></h2><button class="btn" id="addb" type="button"></button></div>
<div class="row"><div style="flex:1;min-width:180px"><label>الامتحان</label><select id="se"></select></div><div style="flex:1;min-width:180px"><label>بحث في الطلاب</label><input id="sq" placeholder="الاسم أو رقم الجلوس"></div></div>
<form id="sf" class="sform hide"><h3 id="sft" style="margin:0 0 8px"></h3><div class="row"><div style="flex:1;min-width:160px"><label>رقم الجلوس *</label><input id="ss" dir="ltr" required></div><div style="flex:2;min-width:200px"><label>اسم الطالب *</label><input id="sname" required minlength="2"></div></div>
<label>بيانات الطالب (الدرجة والنسبة وغيرها — اسم الحقل وقيمته)</label><div id="sfd"></div>
<div class="row"><button class="btn ghost sm" type="button" id="addf"></button></div>
<div class="row" style="margin-top:12px"><button class="btn">حفظ الطالب</button><button class="btn ghost" type="button" id="sc2">إلغاء</button></div></form>
<div style="overflow:auto"><table id="stt"></table></div><p class="mut" style="font-size:.85rem;margin:8px 0 0" id="stm"></p></div>

<div class="card"><h2>رفع النتائج (Excel / CSV)</h2><label>الامتحان</label><select id="es"></select><input type="file" id="fl" accept=".xlsx,.xls,.csv">
<div id="map" class="hide"><label>عمود رقم الجلوس</label><select id="cs"></select><label>عمود اسم الطالب</label><select id="cn"></select><p class="mut" id="pv"></p><button class="btn" id="up">نشر النتائج (يستبدل القديمة)</button></div></div></section>

<section id="t2" class="hide"><div class="card"><h2>نصوص الموقع</h2><p class="mut">كل ما يظهر لطلابك قابل للتعديل. النصوص الحالية افتراضية، عدّلها كما تريد. ترك الحقل فارغاً يعيد النص الافتراضي.</p><div id="ff"></div>
<label><input type="checkbox" id="ns" style="width:auto;margin:0 0 0 8px">السماح للطلاب بالبحث بالاسم (يُظهر رقم الجلوس)</label>
<h2 style="margin-top:18px">الأسئلة الشائعة</h2><div id="fq"></div><button class="btn ghost sm" onclick="addQ()">+ سؤال</button>
<div class="row" style="margin-top:16px"><button class="btn" onclick="saveSite()">حفظ النصوص</button><button class="btn ghost" onclick="fill(DEF(me.name,me.subject));toast('تم تحميل النصوص الافتراضية، اضغط حفظ')">استعادة الافتراضي</button></div></div></section>
<section id="t3" class="hide"><div class="card"><h2>الإعدادات</h2><label>الاسم</label><input id="sn"><label>المادة (تحدد ثيم الموقع)</label><select id="sjs"></select><button class="btn" onclick="saveMe()">حفظ</button></div></section>
<section id="t4" class="hide"><div class="card" id="sub"></div><div class="g3" id="pg" style="margin-top:18px"></div></section></main>
<footer class="foot" id="ft"></footer><div id="toast"></div>
<script src="/app.js"></script><script>
const DFK=['الدرجة','النسبة','الحالة'];let me,faqs=[],rows=[],cols=[],SR=[],FK=DFK,ED=null,sqt;const G=id=>document.getElementById(id);
const F=[['greet','العبارة الافتتاحية'],['title','عنوان الموقع'],['examTitle','عنوان النتائج'],['tagline','الوصف تحت العنوان'],['intro','نص تعريفي','t'],['searchHint','تلميح خانة البحث'],['instructionsTitle','عنوان قسم التعليمات'],['instructions','التعليمات (كل سطر بند مستقل)','t'],['footer','نص الحقوق أسفل الموقع'],['notFound','رسالة عدم العثور على الاسم'],['whatsapp','رقم واتساب بصيغة دولية (مثال 201001234567)']];
G('ff').innerHTML=F.map(f=>'<label>'+f[1]+'</label>'+(f[2]?'<textarea id="f_'+f[0]+'"></textarea>':'<input id="f_'+f[0]+'">')).join('');
G('tabs').innerHTML=[[1,'chart','النتائج والطلاب'],[2,'pen','نصوص الموقع'],[4,'star','الباقات'],[3,'palette','الإعدادات']].map((t,i)=>'<button data-t="'+t[0]+'" class="'+(i?'':'on')+'" role="tab">'+svg(t[1],18)+t[2]+'</button>').join('');
G('addb').innerHTML=svg('useradd',18)+' إضافة طالب يدوياً';G('addf').innerHTML=svg('plus',16)+'حقل جديد';
function head(){const x=applySubject(me.subject);shell(badge(x?x.k:'cap')+'<span>'+esc(me.name)+'</span>','<a class="navlink" href="/">الرئيسية</a><a class="navlink" href="/t/'+esc(me.slug)+'" target="_blank">موقع الطلاب</a>','<a class="hbtn on" href="/dashboard" aria-label="لوحة المدير" title="لوحة المدير">'+svg('shield',18)+'</a><button class="hbtn" onclick="logout()" title="خروج" aria-label="خروج">'+svg('out',18)+'</button>');G('hs').textContent=me.subject;G('hi').textContent='أهلاً '+me.name+'، من هنا تدير نتائج طلابك وموقعك'}
function tab(n){[1,2,3,4].forEach(i=>G('t'+i).classList.toggle('hide',i!=n));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==n))}
G('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)tab(+b.dataset.t)};
function fill(S){F.forEach(f=>G('f_'+f[0]).value=S[f[0]]||'');G('ns').checked=S.nameSearch!==false;faqs=(S.faq||[]).map(x=>({...x}));drawQ()}
function drawQ(){G('fq').innerHTML=faqs.map((f,i)=>'<div class="faqrow"><input value="'+esc(f.q)+'" placeholder="السؤال" oninput="faqs['+i+'].q=this.value"><textarea placeholder="الإجابة" style="min-height:48px" oninput="faqs['+i+'].a=this.value">'+esc(f.a)+'</textarea><button class="btn bad sm" onclick="faqs.splice('+i+',1);drawQ()">حذف</button></div>').join('')}
function addQ(){faqs.push({q:'',a:''});drawQ()}
async function saveSite(){const b={nameSearch:G('ns').checked,faq:faqs};F.forEach(f=>b[f[0]]=G('f_'+f[0]).value);try{me.site=await api('/api/site','PUT',b);toast('تم الحفظ، النصوص ظاهرة الآن للطلاب')}catch(x){toast(x.message)}}
async function saveMe(){try{me=await api('/api/me','PUT',{name:G('sn').value,subject:G('sjs').value});head();toast('تم الحفظ وتغيّر الثيم')}catch(x){toast(x.message)}}
api('/api/me').then(m=>{me=m;head();if(m.imp)G('imp').innerHTML='<div class="card" style="border-color:var(--acc)"><div class="row" style="justify-content:space-between"><b>أنت تتصفح هذا الحساب بصلاحية المدير</b><button class="btn sm" onclick="back()">العودة للوحة الأدمن</button></div></div>';G('lnk').value=location.origin+'/t/'+m.slug;G('pl').href='/t/'+m.slug;
if(!m.active)G('stat').textContent='حسابك قيد المراجعة';G('sn').value=m.name;G('sjs').innerHTML=subjOpts(m.subject);fill(SITE(m.name,m.subject,m.site));load();loadPlans()}).catch(x=>x.status===401?location='/login':toast(x.message));

/* الامتحانات */
async function load(){const e=await api('/api/exams'),a=G('es').value,b=G('se').value,o=e.map(x=>'<option value="'+x._id+'">'+esc(x.title)+'</option>').join('');
 G('es').innerHTML=o;G('se').innerHTML=o;if(e.some(x=>x._id===a))G('es').value=a;if(e.some(x=>x._id===b))G('se').value=b;
 G('ex').innerHTML=e.map(x=>'<tr><td>'+esc(x.title)+'</td><td><span class="tag">'+x.count+' طالب</span></td><td><button class="btn bad sm" onclick="del(\''+x._id+'\')">حذف</button></td></tr>').join('')||'<tr><td class="mut">لا توجد امتحانات بعد</td></tr>';loadSt()}
G('nf').onsubmit=async e=>{e.preventDefault();try{await api('/api/exams','POST',{title:G('nt').value});G('nt').value='';load()}catch(x){toast(x.message)}};
async function del(id){if(confirm('حذف الامتحان وكل نتائجه؟')){await api('/api/exams/'+id,'DELETE');closeF();load()}}

/* الطلاب: عرض / إضافة يدوية / تعديل / حذف */
async function loadSt(){const id=G('se').value;
 if(!id){SR=[];G('stn').textContent='0';G('stt').innerHTML='<tr><td class="mut">أضف امتحاناً أولاً ثم أضف طلابك</td></tr>';G('stm').textContent='';return}
 try{const r=await api('/api/exams/'+id+'/results?q='+encodeURIComponent(G('sq').value.trim()));SR=r.rows;G('stn').textContent=r.total+' طالب';
 const ks=[];SR.forEach(x=>Object.keys(x.data||{}).forEach(k=>{if(!ks.includes(k))ks.push(k)}));FK=ks.length?ks.slice(0,8):DFK;
 G('stt').innerHTML=SR.length?'<tr><th>رقم الجلوس</th><th>الاسم</th><th>البيانات</th><th></th></tr>'+SR.map((x,i)=>'<tr><td><b>'+esc(x.seat)+'</b></td><td>'+esc(x.name)+'</td><td class="mut" style="font-size:.82rem">'+esc(Object.entries(x.data||{}).map(([k,v])=>k+': '+v).join(' • '))+'</td><td class="row" style="flex-wrap:nowrap"><button class="btn ghost sm" onclick="openF('+i+')">تعديل</button><button class="btn bad sm" onclick="delSt('+i+')">'+svg('trash',14)+'</button></td></tr>').join(''):'<tr><td class="mut">'+(G('sq').value.trim()?'لا توجد نتائج مطابقة':'لا يوجد طلاب في هذا الامتحان بعد — أضف طالباً يدوياً أو ارفع ملف Excel')+'</td></tr>';
 G('stm').textContent=r.total>SR.length&&!G('sq').value.trim()?'يعرض أحدث '+SR.length+' طالب فقط — استخدم البحث للوصول لأي طالب.':''}catch(x){toast(x.message)}}
G('se').onchange=()=>{closeF();loadSt()};G('sq').oninput=()=>{clearTimeout(sqt);sqt=setTimeout(loadSt,300)};
const frow=(k='',v='')=>'<div class="frow"><input class="fk" value="'+esc(k)+'" placeholder="اسم الحقل (مثال: الدرجة)"><input class="fv" value="'+esc(v)+'" placeholder="القيمة"></div>';
function drawF(v={}){const keys=[...FK];Object.keys(v).forEach(k=>{if(!keys.includes(k))keys.push(k)});G('sfd').innerHTML=keys.map(k=>frow(k,v[k]??'')).join('')}
function openF(i){if(!G('se').value)return toast('أضف امتحاناً أولاً');ED=i==null?null:SR[i];G('sf').classList.remove('hide');G('sft').textContent=ED?'تعديل بيانات الطالب':'إضافة طالب جديد';
 G('ss').value=ED?ED.seat:'';G('ss').readOnly=!!ED;G('sname').value=ED?ED.name:'';drawF(ED?ED.data:{});G('sf').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>G(ED?'sname':'ss').focus({preventScroll:true}),250)}
function closeF(){G('sf').classList.add('hide');ED=null}
G('addb').onclick=()=>openF();G('sc2').onclick=closeF;G('addf').onclick=()=>G('sfd').insertAdjacentHTML('beforeend',frow());
G('sf').onsubmit=async e=>{e.preventDefault();const data={};document.querySelectorAll('#sfd .frow').forEach(r=>{const k=r.querySelector('.fk').value.trim(),v=r.querySelector('.fv').value.trim();if(k&&v)data[k]=v});
 try{const r=await api('/api/exams/'+G('se').value+'/student','POST',{seat:G('ss').value,name:G('sname').value,data});toast(r.added?'تمت إضافة الطالب ✔':'تم تحديث بيانات الطالب ✔');
 if(r.added){G('ss').value='';G('sname').value='';drawF({});G('ss').focus()}else closeF();ED=null;G('ss').readOnly=false;load()}catch(x){toast(x.message)}};
async function delSt(i){const x=SR[i];if(confirm('حذف الطالب "'+x.name+'" نهائياً؟')){try{await api('/api/exams/'+G('se').value+'/student/'+encodeURIComponent(x.seat),'DELETE');toast('تم الحذف');load()}catch(e){toast(e.message)}}}

/* رفع Excel */
G('fl').onchange=async()=>{const f=G('fl').files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
 if(!rows.length)return toast('الملف فارغ');cols=Object.keys(rows[0]);const o=cols.map(c=>'<option>'+esc(c)+'</option>').join('');G('cs').innerHTML=o;G('cn').innerHTML='<option value="">— بدون —</option>'+o;G('map').classList.remove('hide');G('pv').textContent='تم قراءة '+rows.length+' صف'};
G('up').onclick=async()=>{if(!G('es').value)return toast('أضف امتحاناً أولاً');const cs=G('cs').value,cn=G('cn').value;const out=rows.map(r=>{const d={};cols.forEach(c=>{if(c!==cs&&c!==cn&&r[c]!=='')d[c]=r[c]});return{seat:r[cs],name:cn?r[cn]:'',data:d}});
 try{const r=await api('/api/exams/'+G('es').value+'/results','POST',{rows:out});toast('تم نشر '+r.count+' نتيجة');G('fl').value='';G('map').classList.add('hide');load()}catch(x){toast(x.message)}};

/* الباقات */
async function loadPlans(){try{const d=await api('/api/plans');const nm=Object.fromEntries(d.plans.map(p=>[p.key,p.name])),p=me.plan;
 let t='لا يوجد اشتراك فعّال حالياً';
 if(p&&me.planOk){t='اشتراكك الحالي: '+(nm[p.type]||PNAME[p.type]);if(p.expiresAt)t+=' — ينتهي '+new Date(p.expiresAt).toLocaleDateString('ar-EG');if(p.type==='exam')t+=' — المتبقي '+p.examsLeft+' امتحان'}
 else if(p)t='انتهى اشتراكك السابق ('+(nm[p.type]||PNAME[p.type])+')';
 G('sub').innerHTML='<h2>اشتراكي</h2><p style="margin:0">'+esc(t)+'</p><p class="mut" style="margin:6px 0 0">اختر باقة واضغط اشتراك لمراسلة الإدارة عبر واتساب، وسيتم تفعيل اشتراكك بعد التواصل.</p>';
 G('pg').innerHTML=d.plans.map(x=>planCard(x,d.currency,d.whatsapp,'\nالاسم: '+me.name+' | المادة: '+me.subject+'\nالبريد: '+me.email+'\nرابطي: '+location.origin+'/t/'+me.slug,x.key==='year')).join('');
 G('ft').innerHTML=foot({title:'TeacherM',sub:'لوحة المدير',links:[['/','الرئيسية'],['/t/'+me.slug,'موقع الطلاب']],wa:d.whatsapp,waText:'تواصل مع الإدارة',copy:'جميع الحقوق محفوظة'});reveal()}catch(x){toast(x.message)}}
function back(){api('/api/admin/stop','POST').then(()=>location='/admin').catch(x=>toast(x.message))}
G('ft').innerHTML=foot({title:'TeacherM',sub:'لوحة المدير',links:[['/','الرئيسية']],copy:'جميع الحقوق محفوظة'});reveal();
</script></body></html>
