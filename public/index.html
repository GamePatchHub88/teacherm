<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/favicon.svg"><meta name="theme-color" content="#0f766e"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>TeacherM | نتائج طلابك برابط واحد</title></head><body><div class="wrap"><div id="nav"></div>
<div class="hero"><div><span class="tag">للمدرسين</span><h1>انشر نتائج طلابك <span class="hl">برقم الجلوس</span> في دقيقتين</h1>
<p class="mut">سجّل، ارفع ملف Excel، وخذ رابطك الخاص teacherm.com/t/اسمك. الطالب يكتب رقم جلوسه ويرى نتيجته فوراً من الموبايل.</p></div>
<div class="card"><div class="tabs"><button class="btn" id="b1" onclick="tab(1)">دخول</button><button class="btn ghost" id="b2" onclick="tab(2)">حساب جديد</button></div>
<form id="f1"><label>البريد</label><input name="email" type="email" required><label>كلمة المرور</label><input name="password" type="password" required><button class="btn" style="width:100%">دخول</button></form>
<form id="f2" class="hide"><label>الاسم</label><input name="name" required><label>المادة</label><input name="subject" required><label>الهاتف</label><input name="phone">
<label>البريد</label><input name="email" type="email" required><label>كلمة المرور (8+)</label><input name="password" type="password" minlength="8" required>
<label>رابطك (إنجليزي): teacherm.com/t/<b>slug</b></label><input name="slug" pattern="[a-z0-9-]{3,30}" dir="ltr" required><button class="btn" style="width:100%">إنشاء الحساب</button></form></div></div></div><div id="toast"></div>
<script src="/app.js"></script><script>nav();
function tab(n){f1.classList.toggle('hide',n!=1);f2.classList.toggle('hide',n!=2);b1.className='btn'+(n==1?'':' ghost');b2.className='btn'+(n==2?'':' ghost')}
for(const [f,u] of [[f1,'/api/login'],[f2,'/api/register']])f.onsubmit=async e=>{e.preventDefault();try{const me=await api(u,'POST',Object.fromEntries(new FormData(f)));location=me.role==='admin'?'/admin':'/dashboard'}catch(x){toast(x.message)}};
api('/api/me').then(m=>nav('<a class="btn sm" href="'+(m.role==='admin'?'/admin':'/dashboard')+'">لوحتي</a>')).catch(()=>{});</script></body></html>
